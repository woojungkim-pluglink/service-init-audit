# service-init-audit — GitHub Actions로 PC 없이 무료 자동 실행
#
# GitHub 클라우드 러너에서 매일 08:05 / 17:05 KST에 자동 실행. PC·서버 불필요, 무료.
# 기존 브라우저 폼 로그인(ensureSession)을 그대로 사용 → 별도 API 인증 작업 없음.
#
# ── 사용 준비 (1회) ──
# 1) 이 레포를 GitHub에 push (Private 가능).
# 2) GitHub 레포 → Settings → Secrets and variables → Actions → New repository secret 로 아래 등록:
#    PLINKCONNECT_USERNAME, PLINKCONNECT_PASSWORD,
#    SLACK_BOT_TOKEN, NOTIFY_SLACK_USER_ID, NOTIFY_SLACK_CHANNEL_ID, SLACK_CHANNEL_ID,
#    GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN, GMAIL_USER,
#    PM_GROUP_EMAILS, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#    (값은 GitHub 웹에서 직접 입력 — 본인만 입력, 평문 노출 없음)
# 3) Actions 탭에서 활성화. 끝. (수동 테스트는 "Run workflow" 버튼)
#
# cron은 UTC 기준: 08:05 KST = 23:05 UTC(전날), 17:05 KST = 08:05 UTC.
# (GitHub cron은 몇 분 지연될 수 있음 — 운영상 무방)

name: service-init-audit

# 트리거 이중화 (안전망):
#  1) 정시성 — n8n Schedule(08:05/17:05 KST)이 workflow_dispatch를 호출 → 큐 지연 없이 정시 실행.
#  2) 백업 — GitHub schedule(cron). 무료 러너 큐로 1~3시간 지연되지만 "무조건" 실행됨.
#     n8n이 실패한 날에도 cron이 늦게라도 실행해 알림 누락을 막는다.
#  중복 방지: audit.js가 시작 시 live manifest(index.json)를 확인해, 같은 (date,slot)이 이미
#     처리됐으면 즉시 종료(EXIT 0) → n8n이 정상이면 cron 백업은 자동으로 건너뛴다(중복 발송 없음).
on:
  workflow_dispatch:        # 외부(n8n) 정시 트리거 / 수동 실행
    inputs:
      slot:
        description: 'morning | evening'
        required: false
        default: 'morning'
      force:
        description: '이미 처리된 슬롯도 강제 재실행(중복 방지 가드 무시). 보정 재배포용.'
        type: boolean
        required: false
        default: false
  schedule:                 # 백업(지연 가능) — n8n 실패 시 누락 방지
    - cron: '5 23 * * *'    #  08:05 KST = 23:05 UTC(전날) → morning
    - cron: '5 8 * * *'     #  17:05 KST = 08:05 UTC       → evening

concurrency:
  group: service-init-audit   # 동시 실행 방지(단일 세션)
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Determine slot (KST)
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            # workflow_dispatch(n8n/수동): 입력 슬롯 그대로
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 23 * * *" ]; then
            # 백업 cron: 어느 cron이 발화했는지로 슬롯 결정(지연돼도 정확)
            echo "slot=morning" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 8 * * *" ]; then
            echo "slot=evening" >> "$GITHUB_OUTPUT"
          else
            H=$(TZ=Asia/Seoul date +%H)
            if [ "$H" -lt 12 ]; then echo "slot=morning" >> "$GITHUB_OUTPUT"; else echo "slot=evening" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Seed dashboard history (live 전체 받아 누적 — 과거 파일 유실 방지)
        run: |
          # 러너는 매번 빈 상태로 시작 → 배포 시 폴더에 있는 파일만 라이브에 남는다.
          # index.json(목록)뿐 아니라 참조하는 과거 데이터 파일도 모두 받아와야 배포에 포함돼
          # 이력이 보존된다. seed 실패를 조용히 넘기면(과거엔 `|| true`) 빈 manifest로 배포돼
          # 90일 이력이 통째로 소실되므로(장애 9), 비-404 실패는 여기서 하드페일한다.
          mkdir -p public/data
          BASE="https://service-init-audit.vercel.app/data"
          code=$(curl -sS -o public/data/index.json -w '%{http_code}' "$BASE/index.json" || echo 000)
          if [ "$code" = "404" ]; then
            echo "live index.json 없음(최초 배포) — 빈 상태로 시작"; rm -f public/data/index.json
          elif [ "$code" != "200" ]; then
            echo "::error::seed 실패: index.json fetch http=$code — 이력 유실 방지 위해 중단(재시도 대기)"; exit 1
          else
            miss=0
            for f in $(jq -r '.slots[].file // empty' public/data/index.json 2>/dev/null); do
              curl -fsS "$BASE/$f" -o "public/data/$f" || miss=$((miss+1))
            done
            # settle.json은 index.json slots에 안 잡히므로 별도 seed (미존재=최초엔 404 — 무시)
            curl -fsS "$BASE/settle.json" -o public/data/settle.json || rm -f public/data/settle.json
            echo "seeded $(ls public/data/*.json 2>/dev/null | wc -l) file(s), $miss missing(404 등)"
          fi

      - name: Run audit
        env:
          PLINKCONNECT_USERNAME: ${{ secrets.PLINKCONNECT_USERNAME }}
          PLINKCONNECT_PASSWORD: ${{ secrets.PLINKCONNECT_PASSWORD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTIFY_SLACK_USER_ID: ${{ secrets.NOTIFY_SLACK_USER_ID }}
          NOTIFY_SLACK_CHANNEL_ID: ${{ secrets.NOTIFY_SLACK_CHANNEL_ID }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          # 서비스계정(권장): 시트·Gmail을 API로 접근 — 로그인된 브라우저 세션 불필요(CI 대응).
          #   설정되면 위 GMAIL_* OAuth 대신 이걸 사용. GMAIL_USER(임퍼소네이션 대상)는 계속 필요.
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          # 도메인 전체 위임 등록 완료 → 시트·Gmail 모두 SA가 GMAIL_USER를 임퍼소네이션.
          #   이로써 개인 OAuth 리프레시 토큰 불필요(만료/재발급 부담 없음).
          GOOGLE_DELEGATION: '1'
          PM_GROUP_EMAILS: ${{ secrets.PM_GROUP_EMAILS }}
          PLINKCONNECT_BASE: 'https://connect.pluglink.kr'
          DASHBOARD_URL: 'https://service-init-audit.vercel.app'
          # Vercel 배포 (audit.js 내부 npx vercel deploy 용)
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node audit.js --slot=${{ steps.slot.outputs.slot }}${{ github.event.inputs.force == 'true' && ' --force' || '' }}

      # 잡이 어떤 단계에서든 실패하면(seed 중단·npm·Playwright·audit FATAL·타임아웃) Slack DM으로 통지.
      #   '메시지가 안 왔다'를 사람이 눈치채야 하는 침묵 실패를 없앤다(dead-man 방어).
      - name: Notify on failure (Slack DM)
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTIFY_SLACK_USER_ID: ${{ secrets.NOTIFY_SLACK_USER_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🔴 service-init-audit 실행 실패 — slot=${{ steps.slot.outputs.slot }}, event=${{ github.event_name }}. 로그: $RUN_URL"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "$(jq -nc --arg c "$NOTIFY_SLACK_USER_ID" --arg t "$TEXT" '{channel:$c, text:$t}')" || true

# (re-scan trigger)
