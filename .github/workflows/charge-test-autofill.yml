# 2026-09-29: 리포를 public 으로 전환. private 리포는 계정 공용 Actions 무료 한도(2,000분/월)를 쓰는데
#   VOC 알림의 10분 주기가 이를 소진시켜 2026-09-16 17:05 부터 모든 워크플로가 job 미시작으로 실패했다.
#   public 리포는 Actions 가 무제한이라 한도 문제가 재발하지 않는다.
#   공개 전 히스토리에서 커넥트 화면 스크랩·실제 고객 이메일을 제거했다(git-filter-repo).
#   세탁 전 원본은 private 리포 service-init-audit-archive 에 보존.
name: charge-test-autofill
on:
  schedule:
    - cron: '0 0 * * *'   # 09:00 KST
    - cron: '0 8 * * *'   # 17:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '드라이런(쓰기 안 함)'
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: charge-test-autofill
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Run autofill
        env:
          PLINKCONNECT_USERNAME: ${{ secrets.PLINKCONNECT_USERNAME }}
          PLINKCONNECT_PASSWORD: ${{ secrets.PLINKCONNECT_PASSWORD }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTIFY_SLACK_USER_ID: ${{ secrets.NOTIFY_SLACK_USER_ID }}
          SPREADSHEET_ID: 1uf9BmYEvT424rUOD9mpCheVkuBS_7xb9LOjM4aC57bY
          SHEET_GID: '619747296'
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node index.js --dry-run
          else
            node index.js
          fi
